name: CI

on:
  push:
    branches: [main, master, develop, "feat/**", "fix/**"]
  pull_request:
    branches: [main, master, develop]

permissions:
  contents: read

jobs:
  calidad:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Auditoría de dependencias (altas o críticas)
        run: npm audit --omit=dev --audit-level=high

      - name: Análisis estático
        run: npm run lint

      - name: Tipos
        run: npm run typecheck

      - name: Pruebas
        run: npm test

      - name: Compilar
        run: npm run build
        env:
          ENZONA_API_URL: https://enzona-api.onrender.com
